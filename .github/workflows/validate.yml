name: Validate streams

on:
  push:
    paths: ["data/**","scripts/**",".github/workflows/validate.yml"]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/generate_playlists.py
      - run: python scripts/validate.py
      - run: git diff --exit-code
